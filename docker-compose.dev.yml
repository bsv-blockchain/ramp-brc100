services:

  # Onramp Money BRC-100 Frontend (Development)
  ramp-brc100-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ramp-brc100-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_ONRAMP_APP_ID=${VITE_ONRAMP_APP_ID}
      - VITE_ONRAMP_SANDBOX=${VITE_ONRAMP_SANDBOX:-}
    restart: unless-stopped
