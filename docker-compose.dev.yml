services:

  # Onramper BRC-100 Frontend (Development). The Vite dev server serves the
  # signing endpoint itself, so no separate container is needed here.
  ramp-brc100-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ramp-brc100-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_ONRAMPER_API_KEY=${VITE_ONRAMPER_API_KEY}
      - VITE_ONRAMPER_SIGN_URL=${VITE_ONRAMPER_SIGN_URL:-/api/onramper/sign}
      - SIGNING_SECRET=${SIGNING_SECRET}
    restart: unless-stopped
