services:

  # Onramp Money BRC-100 Frontend
  ramp-brc100:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_ONRAMP_APP_ID=${VITE_ONRAMP_APP_ID}
        - VITE_ONRAMP_SANDBOX=${VITE_ONRAMP_SANDBOX:-}
    container_name: ramp-brc100
    ports:
      - "8080:8080"
    restart: unless-stopped
