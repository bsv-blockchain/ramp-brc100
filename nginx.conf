server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Onramper URL signing service. It runs alongside nginx sharing a network
    # namespace — a sidecar container in the same Kubernetes pod, and
    # `network_mode: service:` in docker-compose — so the upstream is a
    # literal loopback address. No DNS, so this needs no resolver and behaves
    # identically in both environments; nginx still boots if the sign process
    # is not up yet and returns 502 until it is.
    location /api/onramper/sign {
        proxy_pass http://127.0.0.1:8081;
        # $http_host, not $host — the signing service compares the browser's
        # Origin against this, and $host drops the port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
